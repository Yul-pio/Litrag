name: Collect PKU catalog candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect candidates
        run: |
          python scripts/collect_candidates.py \
            --school pku \
            --year 2027 \
            --output data/candidates/pku_2027_catalog.json
      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: pku-2027-catalog-candidates
          path: data/candidates/pku_2027_catalog.json
          if-no-files-found: error