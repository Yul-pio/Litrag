name: Collect admission catalog candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  actions: read

jobs:
  pku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect PKU candidates
        run: |
          python scripts/collect_candidates.py \
            --school pku \
            --year 2027 \
            --output data/candidates/pku_2027_catalog.json
      - name: Review PKU candidates
        run: |
          python scripts/review_candidates.py \
            --candidate-file data/candidates/pku_2027_catalog.json \
            --output data/candidates/pku_2027_catalog.review.md
      - name: Upload PKU candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: pku-2027-catalog-candidates
          path: |
            data/candidates/pku_2027_catalog.json
            data/candidates/pku_2027_catalog.review.md
          if-no-files-found: error
      - name: Sync PKU candidates to review console
        env:
          LITRAG_SITE_URL: https://yulpio.pythonanywhere.com
          LITRAG_GITHUB_TOKEN: ${{ github.token }}
          LITRAG_GITHUB_REPOSITORY: ${{ github.repository }}
          LITRAG_GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${LITRAG_SITE_URL%/}/api/admin/ingest?name=pku_2027_catalog.json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: ${LITRAG_GITHUB_TOKEN}" \
            -H "X-GitHub-Repository: ${LITRAG_GITHUB_REPOSITORY}" \
            -H "X-GitHub-Run-Id: ${LITRAG_GITHUB_RUN_ID}" \
            --data-binary @data/candidates/pku_2027_catalog.json

  tsinghua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect Tsinghua CS candidates
        run: |
          python scripts/collect_candidates.py \
            --school tsinghua \
            --year 2027 \
            --college 计算机科学与技术系 \
            --output data/candidates/tsinghua_2027_catalog.json
      - name: Review Tsinghua candidates
        run: |
          python scripts/review_candidates.py \
            --candidate-file data/candidates/tsinghua_2027_catalog.json \
            --output data/candidates/tsinghua_2027_catalog.review.md
      - name: Upload Tsinghua candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: tsinghua-2027-catalog-candidates
          path: |
            data/candidates/tsinghua_2027_catalog.json
            data/candidates/tsinghua_2027_catalog.review.md
          if-no-files-found: error
      - name: Sync Tsinghua candidates to review console
        env:
          LITRAG_SITE_URL: https://yulpio.pythonanywhere.com
          LITRAG_GITHUB_TOKEN: ${{ github.token }}
          LITRAG_GITHUB_REPOSITORY: ${{ github.repository }}
          LITRAG_GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${LITRAG_SITE_URL%/}/api/admin/ingest?name=tsinghua_2027_catalog.json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: ${LITRAG_GITHUB_TOKEN}" \
            -H "X-GitHub-Repository: ${LITRAG_GITHUB_REPOSITORY}" \
            -H "X-GitHub-Run-Id: ${LITRAG_GITHUB_RUN_ID}" \
            --data-binary @data/candidates/tsinghua_2027_catalog.json
