<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>litrag · 论文问答，答案带页码</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         max-width: 760px; margin: 44px auto; padding: 0 20px; line-height: 1.7; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #555; font-size: 15px; margin-bottom: 6px; }
  .hint { color: #888; font-size: 13px; margin-bottom: 24px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { border: 1px solid #d6d9e0; background: transparent; color: inherit;
          border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
          font-family: inherit; }
  .chip:hover { border-color: #2f6feb; color: #2f6feb; }
  textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px;
             border: 1px solid #ccc; border-radius: 8px; min-height: 84px;
             font-family: inherit; resize: vertical; }
  button.go { margin-top: 10px; padding: 10px 20px; font-size: 15px; cursor: pointer;
              border: 0; border-radius: 8px; background: #2f6feb; color: #fff; }
  button.go:disabled { background: #9ab; cursor: wait; }
  #out { margin-top: 28px; display: none; }
  .answer { white-space: pre-wrap; }
  .cite { margin-top: 18px; font-size: 13px; color: #666; border-top: 1px dashed #ccc;
          padding-top: 14px; }
  .cite div { margin-bottom: 10px; }
  .warn { margin-top: 14px; padding: 10px 12px; background: #fff4e5; color: #8a5a00;
          border-radius: 8px; font-size: 13px; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid #eee;
           color: #999; font-size: 12px; }
</style>
</head>
<body>
  <h1>litrag</h1>
  <div class="sub">内置 5 篇 RAG 论文（约 47 万字），问它任何问题，答案都标出页码。</div>
  <div class="hint">资料里没有的，它会直接说"没有"，不编造。</div>

  <div class="examples">
    <button class="chip">What are the three stages of RAG?</button>
    <button class="chip">What are reflection tokens in Self-RAG?</button>
    <button class="chip">What happens when relevant information is in the middle?</button>
  </div>

  <textarea id="q" placeholder="用英文提问效果最好，例如：What evaluation metric is used for short-form QA tasks?"></textarea>
  <button class="go" id="go">提问</button>

  <div id="out">
    <div class="answer" id="answer"></div>
    <div class="warn" id="warn" style="display:none"></div>
    <div class="cite" id="cite"></div>
  </div>

  <footer>
    检索 BM25 · 回答为原文摘录 · 46 题评测集 Recall@1 89.1% ·
    <a href="https://github.com/Yul-pio/litrag">源码</a>
  </footer>

<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const out = document.getElementById('out');
const answerEl = document.getElementById('answer');
const citeEl = document.getElementById('cite');
const warnEl = document.getElementById('warn');

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; go.textContent = '检索中…';
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    if (data.error) {
      answerEl.textContent = '出错了：' + data.error;
    } else {
      answerEl.textContent = data.answer;
      citeEl.innerHTML = (data.citations || []).map(c =>
        `<div><b>[${c.id}]</b> ${c.doc} / ${c.section}` +
        (c.page ? `，第 ${c.page} 页` : '') +
        `<br>「${c.quote}」</div>`
      ).join('');
      warnEl.style.display = data.warning ? 'block' : 'none';
      warnEl.textContent = data.warning || '';
    }
    out.style.display = 'block';
  } catch (err) {
    answerEl.textContent = '请求失败：' + err;
    out.style.display = 'block';
  } finally {
    go.disabled = false; go.textContent = '提问';
  }
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    q.value = chip.textContent;
    ask();
  });
});

go.addEventListener('click', ask);
q.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask();
});
</script>
</body>
</html>
