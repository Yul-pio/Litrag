<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>litrag · 读论文，答案带页码</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .lead { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .sub { color: #555; font-size: 15px; margin-bottom: 20px; }
  .panel { border: 1px dashed #cfd4dd; border-radius: 10px; padding: 14px 16px;
           margin-bottom: 20px; font-size: 14px; }
  .panel b { color: #222; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .file-btn { border: 1px solid #2f6feb; color: #2f6feb; background: transparent;
              border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
              font-family: inherit; }
  .file-btn:hover { background: #f0f5ff; }
  #status { font-size: 13px; color: #666; }
  .docs { font-size: 13px; color: #666; margin-top: 8px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { border: 1px solid #d6d9e0; background: transparent; color: inherit;
          border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
          font-family: inherit; }
  .chip:hover { border-color: #2f6feb; color: #2f6feb; }
  textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px;
             border: 1px solid #ccc; border-radius: 8px; min-height: 76px;
             font-family: inherit; resize: vertical; }
  button.go { margin-top: 10px; padding: 10px 22px; font-size: 15px; cursor: pointer;
              border: 0; border-radius: 8px; background: #2f6feb; color: #fff; }
  button.go:disabled { background: #9ab; cursor: wait; }
  #out { margin-top: 26px; display: none; }
  .answer { white-space: pre-wrap; }
  .cite { margin-top: 18px; font-size: 13px; color: #666; border-top: 1px dashed #ccc;
          padding-top: 14px; }
  .cite div { margin-bottom: 10px; }
  .warn { margin-top: 14px; padding: 10px 12px; background: #fff4e5; color: #8a5a00;
          border-radius: 8px; font-size: 13px; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid #eee;
           color: #999; font-size: 12px; }
</style>
</head>
<body>
  <h1>litrag</h1>
  <div class="lead">把论文丢进来，问它问题，答案直接标出第几页。</div>
  <div class="sub">不是聊天机器人——它只摘论文里的原话。资料里没有的，它直接说“没有”。</div>

  <div class="panel">
    <b>① 上传你的论文</b>（PDF，可多选，最多 10 篇）
    <div class="row">
      <input type="file" id="files" accept="application/pdf" multiple hidden>
      <button class="file-btn" id="pick">选择 PDF 文件</button>
      <span id="status"></span>
    </div>
    <div class="docs" id="docs">正在读取你的文献库…</div>
  </div>

  <div class="examples">
    <button class="chip">什么是 RAG？</button>
    <button class="chip">What are the three stages of RAG?</button>
    <button class="chip">What are reflection tokens in Self-RAG?</button>
  </div>

  <textarea id="q" placeholder="② 提问。英文论文用英文问效果最好"></textarea>
  <button class="go" id="go">提问</button>

  <div id="out">
    <div class="answer" id="answer"></div>
    <div class="warn" id="warn" style="display:none"></div>
    <div class="cite" id="cite"></div>
  </div>

  <footer>
    检索 BM25 · 回答为原文摘录 · 46 题评测集 Recall@1 89.1% ·
    <a href="https://github.com/Yul-pio/litrag">源码</a>
  </footer>

<script>
const SESSION = (() => {
  let s = localStorage.getItem('litrag_sid');
  if (!s) {
    s = 's' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('litrag_sid', s);
  }
  return s;
})();

const q = document.getElementById('q');
const go = document.getElementById('go');
const out = document.getElementById('out');
const answerEl = document.getElementById('answer');
const citeEl = document.getElementById('cite');
const warnEl = document.getElementById('warn');
const docsEl = document.getElementById('docs');
const statusEl = document.getElementById('status');
const fileInput = document.getElementById('files');
const pick = document.getElementById('pick');

async function loadDocs() {
  try {
    const res = await fetch('/api/docs', { headers: {'X-Session': SESSION} });
    const data = await res.json();
    if (!data.docs || data.docs.length === 0) {
      docsEl.textContent = '还没有上传——当前使用演示库（5 篇 RAG 论文）。';
    } else {
      docsEl.textContent = `你的文献库（${data.docs.length} 篇）：` +
        data.docs.map(d => `${d.filename}（${d.chunks} 块）`).join('、');
    }
  } catch (e) {
    docsEl.textContent = '读取文献库失败：' + e;
  }
}

async function uploadFiles(files) {
  for (const file of files) {
    if (!file.name.toLowerCase().endsWith('.pdf')) {
      statusEl.textContent = `${file.name} 不是 PDF，已跳过`;
      continue;
    }
    statusEl.textContent = `上传中：${file.name}…`;
    try {
      const res = await fetch('/api/upload?name=' + encodeURIComponent(file.name), {
        method: 'POST',
        headers: {'X-Session': SESSION, 'Content-Type': 'application/pdf'},
        body: file
      });
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = `${file.name} 失败：${data.error}`;
      } else {
        statusEl.textContent = `${file.name} 完成：${data.chars} 字，${data.chunks} 块`;
      }
    } catch (e) {
      statusEl.textContent = `${file.name} 上传失败：` + e;
    }
  }
  loadDocs();
}

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; go.textContent = '检索中…';
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Session': SESSION},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    if (data.error) {
      answerEl.textContent = '出错了：' + data.error;
    } else {
      answerEl.textContent = data.answer;
      citeEl.innerHTML = (data.citations || []).map(c =>
        `<div><b>[${c.id}]</b> ${c.doc} / ${c.section}` +
        (c.page ? `，第 ${c.page} 页` : '') +
        `<br>「${c.quote}」</div>`
      ).join('');
      warnEl.style.display = data.warning ? 'block' : 'none';
      warnEl.textContent = data.warning || '';
    }
    out.style.display = 'block';
  } catch (err) {
    answerEl.textContent = '请求失败：' + err;
    out.style.display = 'block';
  } finally {
    go.disabled = false; go.textContent = '提问';
  }
}

pick.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFiles(fileInput.files);
  fileInput.value = '';
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    q.value = chip.textContent;
    ask();
  });
});

go.addEventListener('click', ask);
q.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask();
});

loadDocs();
</script>
</body>
</html>
